[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache", "**/.ruff_cache", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.14.6"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
